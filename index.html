function trailerUrl(t){return 'https://www.youtube.com/results?search_query='+encodeURIComponent(t+' tráiler oficial español subtitulado')}
function card(t){const d=info(t);return '<article class="card"><div class="poster"><div class="fallback">'+t+'</div></div><div class="name">'+t+'</div><div class="meta">'+(d[0]!=='—'?d[0]+' · '+d[1]+' '+(d[1]===1?'temporada':'temporadas'):'Datos por completar')+'</div><div class="actions"><a href="'+trailerUrl(t)+'" target="_blank" rel="noopener noreferrer">▶ Tráiler</a><button type="button" class="info-button" data-title="'+encodeURIComponent(t)+'">Info</button></div></article>'}
function render(){const q=document.getElementById('q').value.toLowerCase().trim(),cats=active==='Todas'?Object.keys(G):[active];let html=active==='Todas'&&!q?'<div class="hero"><b>Tu próximo capítulo empieza aquí.</b><div class="muted">'+Object.values(G).flat().length+' series en tu catálogo.</div></div>':'';cats.forEach(c=>{const xs=G[c].filter(t=>t.toLowerCase().includes(q)).sort((a,b)=>info(b)[0]-info(a)[0]||a.localeCompare(b,'es'));if(xs.length)html+='<section class="section"><h2>'+c+'</h2><div class="muted">'+xs.length+' series</div><div class="grid">'+xs.map(card).join('')+'</div></section>'});document.getElementById('app').innerHTML=html||'<div class="muted">No encontré esa serie.</div>'}
function openInfo(t){const d=info(t),x=details(t),body=document.getElementById('modalBody');document.getElementById('modal').classList.add('open');body.innerHTML='<h3>'+t+'</h3><div class="facts"><span class="fact">'+d[0]+'</span><span class="fact">'+(d[1]!=='—'?d[1]+' '+(d[1]===1?'temporada':'temporadas'):'Temporadas: pendiente')+'</span><span class="fact">'+d[2]+'</span></div><section class="info-section"><h4>Sinopsis</h4><p>'+synopsis(t,d)+'</p></section><section class="info-section"><h4>Creador/a</h4><p>'+x[0]+'</p></section><section class="info-section"><h4>Reparto principal</h4><p>'+x[1]+'</p></section><section class="info-section"><h4>Disponible en España</h4><p>'+x[2]+'</p></section><p class="muted">La disponibilidad puede cambiar según la plataforma.</p>'}
document.getElementById('app').onclick=e=>{const button=e.target.closest('.info-button');if(button)openInfo(decodeURIComponent(button.dataset.title))};document.getElementById('close').onclick=()=>document.getElementById('modal').classList.remove('open');document.getElementById('modal').onclick=e=>{if(e.target.id==='modal')document.getElementById('modal').classList.remove('open')};render();</script></body></html>
