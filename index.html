<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mi estantería de series</title><style>body{margin:0;background:#08080b;color:#f7f7f8;font-family:system-ui,sans-serif}header{padding:32px 6vw;position:sticky;top:0;background:#08080bdd;backdrop-filter:blur(18px);z-index:5}h1{font-size:clamp(2.5rem,7vw,5rem);letter-spacing:-.06em;margin:.2em 0}.muted{color:#aaa}button,input{border:1px solid #292932;background:#15151b;color:white;border-radius:999px;padding:9px 13px;margin:4px;font:inherit}button.active{background:white;color:#111}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:18px}.wrap{padding:24px 6vw 60px}.section{margin:35px 0}.card{background:#111116;border:1px solid #282831;border-radius:15px;overflow:hidden;transition:.2s}.card:hover{transform:translateY(-5px);border-color:#666}.poster{aspect-ratio:2/3;background:#211d28;position:relative}.poster img{width:100%;height:100%;object-fit:cover}.name{padding:11px;font-weight:750}.tag{font-size:.7rem;color:#aaa;padding:0 11px 10px}.actions{padding:0 11px 12px;display:flex;gap:6px}.actions a{flex:1;text-align:center;background:#19191f;color:#fff;text-decoration:none;border:1px solid #292932;border-radius:8px;padding:7px;font-size:.72rem}.hero{padding:20px;border:1px solid #292932;border-radius:18px;background:linear-gradient(120deg,#251d2d,#111116);margin-bottom:30px}.empty{color:#aaa;padding:30px 0}</style></head><body><header><div class="muted">ANAC. · SERIES</div><h1>Mi estantería.</h1><p class="muted">Tu catálogo personal, sin perderte entre temporadas.</p><div id="filters"></div><input id="q" placeholder="Buscar serie…"></header><main class="wrap" id="app"></main><script>
const groups={"🎬 Viendo ahora":["Euphoria","Cien años de soledad"],"✅ Terminadas":["This Is Us","Espartaco","Narcos","La Casa de Papel","Las chicas del cable","Game of Thrones","The White Lotus","Succession","Sex Education","Fleabag","The Office","Friends","Lost","Élite","Valeria","El caso Asunta","Respira","El desorden que dejas","Entrevías","El tiempo que te doy","Borgen","The Diplomat","Vivir sin permiso","Sex and the City","How to Get Away with Murder","Suits","Anatomía de un escándalo","Merlí","Merlí: Sapere Aude","Pablo Escobar: El patrón del mal","La casa de las flores","Monsters: The Lyle and Erik Menendez Story","Paquita Salas"],"🔜 Esperando nueva temporada":["The Last of Us","Machos Alfa","The Pitt","Emily in Paris"],"📌 Pendientes":["Normal People","The Crown","Bridgerton","Peaky Blinders","How I Met Your Mother","Modern Family","Mare of Easttown","Chernobyl","The Morning Show","Years and Years","Griselda","Aquí no hay quien viva","Atypical","Adolescence","The Penguin","The Gentlemen","Paradise","Landman"],"⏸️ Para retomar":["Black Mirror","Severance","The Good Doctor"],"❌ Sin finalizar":["Prison Break","House of Cards","Ozark","Outlander","Stranger Things"]};
let active="Todas";const all=Object.values(groups).flat();const filters=document.getElementById('filters');filters.innerHTML='<button class="active" data-x="Todas">Todas</button>'+Object.keys(groups).map(x=>`<button data-x="${x}">${x}</button>`).join('');filters.onclick=e=>{if(e.target.tagName==='BUTTON'){active=e.target.dataset.x;document.querySelectorAll('#filters button').forEach(b=>b.classList.toggle('active',b.dataset.x===active));render()}};document.getElementById('q').oninput=render;const aliases={'Cien años de soledad':'One Hundred Years of Solitude','La Casa de Papel':'Money Heist','Las chicas del cable':'Cable Girls','Espartaco':'Spartacus','El caso Asunta':'The Asunta Case','El desorden que dejas':'The Mess You Leave Behind','Entrevías':'Wrong Side of the Tracks','El tiempo que te doy':'The Time It Takes','Vivir sin permiso':'Unauthorized Living','Anatomía de un escándalo':'Anatomy of a Scandal','Merlí: Sapere Aude':'Merli Sapere Aude','Pablo Escobar: El patrón del mal':'Pablo Escobar: The Boss','La casa de las flores':'The House of Flowers','Aquí no hay quien viva':'Aqui no hay quien viva','Élite':'Elite'};function yt(t){return 'https://www.youtube.com/results?search_query='+encodeURIComponent(t+' official trailer')}async function poster(title,el){try{let r=await fetch('https://api.tvmaze.com/singlesearch/shows?q='+encodeURIComponent(aliases[title]||title));if(!r.ok)return;let s=await r.json(),u=s.image&&(s.image.original||s.image.medium);if(u)el.innerHTML=`<img src="${u}" alt="Portada de ${title}" loading="lazy">`}catch(e){}}function render(){let q=document.getElementById('q').value.toLowerCase().trim();let cats=active==='Todas'?Object.keys(groups):[active];document.getElementById('app').innerHTML=(active==='Todas'&&!q?'<div class="hero"><b>Tu próximo capítulo empieza aquí.</b><div class="muted">'+all.length+' series en tu catálogo.</div></div>':'')+cats.map(c=>{let xs=groups[c].filter(t=>t.toLowerCase().includes(q));if(!xs.length)return '';return `<section class="section"><h2>${c}</h2><p class="muted">${xs.length} series</p><div class="grid">${xs.map(t=>`<article class="card"><div class="poster" id="p${encodeURIComponent(t)}"></div><div class="name">${t}</div><div class="tag">${c.replace(/^.\s/,'')}</div><div class="actions"><a target="_blank" href="${yt(t)}">▶ Tráiler</a><a target="_blank" href="https://www.google.com/search?q=${encodeURIComponent(t+' serie')}">Info</a></div></article>`).join('')}</div></section>`}).join('')||'<div class="empty">No encontré esa serie.</div>';cats.forEach(c=>groups[c].filter(t=>t.toLowerCase().includes(q)).forEach(t=>poster(t,document.getElementById('p'+encodeURIComponent(t)))))}render();</script></body></html>
