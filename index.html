<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mi estantería de series</title><style>body{margin:0;background:#08080b;color:#f7f7f8;font-family:Inter,system-ui,sans-serif}header{padding:32px 5vw 22px;background:#08080bdd;backdrop-filter:blur(20px);position:sticky;top:0;z-index:5;border-bottom:1px solid #ffffff0b}.eyebrow{color:#eab8ff;font-weight:800;letter-spacing:.12em;text-transform:uppercase;font-size:.72rem}h1{font-size:clamp(2.5rem,6vw,5rem);line-height:.9;letter-spacing:-.065em;margin:.35rem 0 .7rem}.muted{color:#a5a5b0}button,input{border:1px solid #292931;background:#15151b;color:#fff;border-radius:999px;padding:9px 13px;margin:4px;font:inherit}button{cursor:pointer}button.active{background:#fff;color:#111}.wrap{padding:24px 5vw 70px}.hero{padding:22px;border:1px solid #292931;border-radius:20px;background:linear-gradient(120deg,#261f30,#111116);margin-bottom:30px}.section{margin:38px 0 46px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:18px}.card{overflow:hidden;border:1px solid #292931;background:#111116;border-radius:15px;transition:.2s}.card:hover{transform:translateY(-5px);border-color:#5c5c67}.poster{aspect-ratio:2/3;background:#231d29;position:relative}.poster img{width:100%;height:100%;object-fit:cover;display:block}.fallback{position:absolute;inset:0;display:flex;align-items:flex-end;padding:14px;font-weight:900;background:linear-gradient(180deg,transparent 50%,#000d)}.name{padding:11px 11px 4px;font-weight:800}.meta{padding:0 11px 7px;color:#a5a5b0;font-size:.74rem;min-height:38px}.actions{display:flex;gap:7px;padding:0 11px 12px}.actions a,.actions button{flex:1;text-align:center;text-decoration:none;color:#fff;background:#18181f;border:1px solid #292931;border-radius:8px;padding:7px 5px;font-size:.72rem;margin:0}.actions a.disabled{opacity:.45;pointer-events:none}.modal{position:fixed;inset:0;background:#0009;display:none;align-items:center;justify-content:center;padding:18px;z-index:20}.modal.open{display:flex}.dialog{width:min(720px,100%);max-height:88vh;overflow:auto;background:#121218;border:1px solid #393944;border-radius:20px;box-shadow:0 30px 90px #0008;padding:22px}.close{float:right;background:transparent;border:0;font-size:1.4rem;color:#fff;cursor:pointer}.dialog h3{font-size:2rem;line-height:1;margin:0 35px 10px 0}.facts{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 18px}.fact{padding:7px 10px;border-radius:999px;background:#1b1b23;border:1px solid #292931;font-size:.78rem}.dialog p{color:#c4c4cc;line-height:1.55}@media(max-width:650px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}header{position:relative}}</style></head><body><header><div class="eyebrow">ANAC. · SERIES</div><h1>Mi estantería.</h1><p class="muted">Tu catálogo personal, con estado, temporadas y ficha de cada serie.</p><div id="filters"></div><input id="q" placeholder="Buscar serie…"></header><main class="wrap" id="app"></main><div class="modal" id="modal"><div class="dialog"><button class="close" id="close">×</button><div id="modalBody"><p>Cargando…</p></div></div></div><script>const GROUPS={"🎬 Viendo ahora":["Euphoria","Cien años de soledad"],"✅ Terminadas":["This Is Us","Espartaco","Narcos","La Casa de Papel","Las chicas del cable","Game of Thrones","The White Lotus","Succession","Sex Education","Fleabag","The Office","Friends","Lost","Élite","Valeria","El caso Asunta","Respira","El desorden que dejas","Entrevías","El tiempo que te doy","Borgen","The Diplomat","Vivir sin permiso","Sex and the City","How to Get Away with Murder","Suits","Anatomía de un escándalo","Merlí","Merlí: Sapere Aude","Pablo Escobar: El patrón del mal","La casa de las flores","Monsters: The Lyle and Erik Menendez Story","Paquita Salas"],"🔜 Esperando nueva temporada":["The Last of Us","Machos Alfa","The Pitt","Emily in Paris"],"📌 Pendientes":["Normal People","The Crown","Bridgerton","Peaky Blinders","How I Met Your Mother","Modern Family","Mare of Easttown","Chernobyl","The Morning Show","Years and Years","Griselda","Aquí no hay quien viva","Atypical","Adolescence","The Penguin","The Gentlemen","Paradise","Landman"],"⏸️ Para retomar":["Black Mirror","Severance","The Good Doctor"],"❌ Sin finalizar":["Prison Break","House of Cards","Ozark","Outlander","Stranger Things"]};const TRAILERS={"Cien años de soledad":"https://www.youtube.com/watch?v=47eCCK8gX9k&cc_load_policy=1&cc_lang_pref=es","The Last of Us":"https://www.youtube.com/watch?v=yyGetSp7Clc&cc_load_policy=1&cc_lang_pref=es","Élite":"https://www.youtube.com/watch?v=4XF3bd2ujic&cc_load_policy=1&cc_lang_pref=es","La Casa de Papel":"https://www.youtube.com/watch?v=3y-6iaveY6c&cc_load_policy=1&cc_lang_pref=es","El desorden que dejas":"https://www.youtube.com/watch?v=AV-1wmObSd8&cc_load_policy=1&cc_lang_pref=es","El tiempo que te doy":"https://www.youtube.com/watch?v=HoerRgtAjNU&cc_load_policy=1&cc_lang_pref=es","Respira":"https://www.youtube.com/watch?v=PEoPYfmwFLw&cc_load_policy=1&cc_lang_pref=es","Adolescence":"https://www.youtube.com/watch?v=Wk5OxqtpBR4&cc_load_policy=1&cc_lang_pref=es","The Pitt":"https://www.youtube.com/watch?v=ufR_08V38sQ&cc_load_policy=1&cc_lang_pref=es","The Crown":"https://www.youtube.com/watch?v=JWtnJjn6ng0&cc_load_policy=1&cc_lang_pref=es","Sex Education":"https://www.youtube.com/watch?v=pC5aQdUNG6U&cc_load_policy=1&cc_lang_pref=es"};const aliases={"Cien años de soledad":"One Hundred Years of Solitude","La Casa de Papel":"Money Heist","Las chicas del cable":"Cable Girls","Espartaco":"Spartacus","El caso Asunta":"The Asunta Case","El desorden que dejas":"The Mess You Leave Behind","Entrevías":"Wrong Side of the Tracks","El tiempo que te doy":"The Time It Takes","Vivir sin permiso":"Unauthorized Living","Anatomía de un escándalo":"Anatomy of Scandal","Merlí: Sapere Aude":"Merli Sapere Aude","Pablo Escobar: El patrón del mal":"Pablo Escobar: The Boss","La casa de las flores":"The House of Flowers","Aquí no hay quien viva":"Aqui no hay quien viva","Élite":"Elite"};let active="Todas",cache={};const filters=document.getElementById('filters');filters.innerHTML='<button class="active" data-x="Todas">Todas</button>'+Object.keys(GROUPS).map(x=>'<button data-x="'+x+'">'+x+'</button>').join('');filters.onclick=e=>{if(e.target.tagName==='BUTTON'){active=e.target.dataset.x;document.querySelectorAll('#filters button').forEach(b=>b.classList.toggle('active',b.dataset.x===active));render()}};document.getElementById('q').oninput=render;async function getShow(title){if(Object.prototype.hasOwnProperty.call(cache,title))return cache[title];try{const r=await fetch('https://api.tvmaze.com/singlesearch/shows?q='+encodeURIComponent(aliases[title]||title));if(!r.ok)throw 0;const show=await r.json();let seasons=[];try{const sr=await fetch('https://api.tvmaze.com/shows/'+show.id+'/seasons');if(sr.ok)seasons=await sr.json()}catch(e){}const data=Object.assign({},show,{seasonCount:seasons.length||null});cache[title]=data;return data}catch(e){cache[title]=null;return null}}function card(title){const id='p'+encodeURIComponent(title),direct=TRAILERS[title];return '<article class="card"><div class="poster" id="'+id+'"><div class="fallback">'+title+'</div></div><div class="name">'+title+'</div><div class="meta" id="m'+encodeURIComponent(title)+'">Cargando datos…</div><div class="actions">'+(direct?'<a href="'+direct+'" target="_blank" rel="noopener">▶ Tráiler</a>':'<a class="disabled">▶ Tráiler</a>')+'<button onclick="openInfo('+JSON.stringify(title)+')">Info</button></div></article>'}async function hydrate(title){const s=await getShow(title),p=document.getElementById('p'+encodeURIComponent(title)),m=document.getElementById('m'+encodeURIComponent(title));if(!s)return;const year=(s.premiered||'').slice(0,4)||'—',seasons=s.seasonCount||'—';m.textContent=year+' · '+seasons+' '+(seasons===1?'temporada':'temporadas');if(p&&s.image&&(s.image.original||s.image.medium))p.innerHTML='<img src="'+(s.image.original||s.image.medium)+'" alt="Portada de '+title+'" loading="lazy">'}function render(){const q=document.getElementById('q').value.toLowerCase().trim(),cats=active==='Todas'?Object.keys(GROUPS):[active];let html=active==='Todas'&&!q?'<div class="hero"><b>Tu próximo capítulo empieza aquí.</b><div class="muted">'+Object.values(GROUPS).flat().length+' series en tu catálogo.</div></div>':'';cats.forEach(c=>{const xs=GROUPS[c].filter(t=>t.toLowerCase().includes(q));if(!xs.length)return;html+='<section class="section"><h2>'+c+'</h2><div class="muted">'+xs.length+' series</div><div class="grid">'+xs.map(card).join('')+'</div></section>'});document.getElementById('app').innerHTML=html||'<div class="muted">No encontré esa serie.</div>';cats.flatMap(c=>GROUPS[c]).filter(t=>t.toLowerCase().includes(q)).forEach(hydrate)}async function openInfo(title){document.getElementById('modal').classList.add('open');document.getElementById('modalBody').innerHTML='<p>Cargando información…</p>';const s=await getShow(title);if(!s){document.getElementById('modalBody').innerHTML='<h3>'+title+'</h3><p>No pude recuperar la ficha en este momento.</p>';return}const y=(s.premiered||'').slice(0,4)||'—',end=(s.ended||'').slice(0,4),period=end?y+'–'+end:y,summary=(s.summary||'').replace(/<[^>]+>/g,' '),platform=s.network?.name||s.webChannel?.name||'';document.getElementById('modalBody').innerHTML='<h3>'+title+'</h3><div class="facts"><span class="fact">'+period+'</span><span class="fact">'+(s.seasonCount||'—')+' '+(s.seasonCount===1?'temporada':'temporadas')+'</span><span class="fact">'+((s.genres||[]).join(' · ')||'Serie')+'</span><span class="fact">'+(s.status||'')+'</span></div><p>'+(summary||'Sin sinopsis disponible.')+'</p>'+(platform?'<div class="muted">Plataforma/cadena: '+platform+'</div>':'')};document.getElementById('close').onclick=()=>document.getElementById('modal').classList.remove('open');document.getElementById('modal').onclick=e=>{if(e.target.id==='modal')document.getElementById('modal').classList.remove('open')};render();</script></body></html>
