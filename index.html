<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mi estantería de series</title><style>body{margin:0;background:#08080b;color:#f7f7f8;font-family:system-ui,sans-serif}header{padding:30px 5vw 22px;background:#08080bf2;position:sticky;top:0;z-index:5;border-bottom:1px solid #ffffff12}.eyebrow{color:#eab8ff;font-weight:800;letter-spacing:.12em;text-transform:uppercase;font-size:.72rem}h1{font-size:clamp(2.5rem,6vw,5rem);line-height:.9;letter-spacing:-.065em;margin:.35rem 0 .7rem}.muted{color:#a5a5b0}button,input{border:1px solid #292931;background:#15151b;color:#fff;border-radius:999px;padding:9px 13px;margin:4px;font:inherit}button{cursor:pointer}button.active{background:#fff;color:#111}.wrap{padding:24px 5vw 70px}.hero{padding:22px;border:1px solid #292931;border-radius:20px;background:linear-gradient(120deg,#261f30,#111116);margin-bottom:30px}.section{margin:38px 0 46px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:18px}.card{overflow:hidden;border:1px solid #292931;background:#111116;border-radius:15px;transition:.2s}.card:hover{transform:translateY(-5px);border-color:#5c5c67}.poster{aspect-ratio:2/3;background:#231d29}.poster img{width:100%;height:100%;object-fit:cover;display:block}.fallback{height:100%;display:flex;align-items:flex-end;padding:14px;box-sizing:border-box;font-weight:900;background:linear-gradient(180deg,#29202f,#09090c)}.name{padding:11px 11px 4px;font-weight:800}.meta{padding:0 11px 7px;color:#a5a5b0;font-size:.74rem}.actions{display:flex;gap:7px;padding:0 11px 12px}.actions a,.actions button{flex:1;text-align:center;text-decoration:none;color:#fff;background:#18181f;border:1px solid #292931;border-radius:8px;padding:8px 5px;font-size:.72rem;margin:0}.disabled{opacity:.38;pointer-events:none}.modal{position:fixed;inset:0;background:#000c;display:none;align-items:center;justify-content:center;padding:18px;z-index:20}.modal.open{display:flex}.dialog{width:min(720px,100%);max-height:88vh;overflow:auto;background:#121218;border:1px solid #393944;border-radius:20px;padding:22px}.close{float:right;background:transparent;border:0;font-size:1.5rem;color:#fff}.dialog h3{font-size:2rem;line-height:1;margin:0 35px 10px 0}.facts{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 18px}.fact{padding:7px 10px;border-radius:999px;background:#1b1b23;border:1px solid #292931;font-size:.78rem}.dialog p{color:#c4c4cc;line-height:1.55}.dialog a{color:#fff}.error{padding:14px;border:1px solid #393944;border-radius:12px;background:#19191f;color:#bbb}@media(max-width:650px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}header{position:relative}}</style></head><body><header><div class="eyebrow">ANAC. · SERIES</div><h1>Mi estantería.</h1><p class="muted">Tu catálogo personal, con año, temporadas y fichas.</p><div id="filters"></div><input id="q" placeholder="Buscar serie…"></header><main class="wrap" id="app"></main><div class="modal" id="modal"><div class="dialog"><button class="close" id="close">×</button><div id="modalBody"></div></div></div><script>
const G={"🎬 Viendo ahora":["Euphoria","Cien años de soledad"],"✅ Terminadas":["This Is Us","Espartaco","Narcos","La Casa de Papel","Las chicas del cable","Game of Thrones","The White Lotus","Succession","Sex Education","Fleabag","The Office","Friends","Lost","Élite","Valeria","El caso Asunta","Respira","El desorden que dejas","Entrevías","El tiempo que te doy","Borgen","The Diplomat","Vivir sin permiso","Sex and the City","How to Get Away with Murder","Suits","Anatomía de un escándalo","Merlí","Merlí: Sapere Aude","Pablo Escobar: El patrón del mal","La casa de las flores","Monsters: The Lyle and Erik Menendez Story","Paquita Salas"],"🔜 Esperando nueva temporada":["The Last of Us","Machos Alfa","The Pitt","Emily in Paris"],"📌 Pendientes":["Normal People","The Crown","Bridgerton","Peaky Blinders","How I Met Your Mother","Modern Family","Mare of Easttown","Chernobyl","The Morning Show","Years and Years","Griselda","Aquí no hay quien viva","Atypical","Adolescence","The Penguin","The Gentlemen","Paradise","Landman"],"⏸️ Para retomar":["Black Mirror","Severance","The Good Doctor"],"❌ Sin finalizar":["Prison Break","House of Cards","Ozark","Outlander","Stranger Things"]};
const DATA={"Euphoria":[2019,3,"Drama · Adolescencia","Euphoria sigue a un grupo de estudiantes mientras lidian con identidad, relaciones, drogas y redes sociales."],"Cien años de soledad":[2024,1,"Drama · Realismo mágico","La familia Buendía atraviesa generaciones de amor, poder, soledad y destino en Macondo."],"Narcos":[2015,3,"Crimen · Drama","Historia del narcotráfico y de los personajes que marcaron la guerra contra las drogas en Colombia."],"La Casa de Papel":[2017,5,"Crimen · Thriller","Un misterioso Profesor reúne a un grupo de atracadores para ejecutar grandes golpes."],"The Last of Us":[2023,2,"Drama · Postapocalíptica","Joel y Ellie atraviesan una civilización devastada mientras intentan sobrevivir y encontrar esperanza."],"Stranger Things":[2016,5,"Ciencia ficción · Misterio","Un grupo de amigos descubre secretos sobrenaturales y una dimensión paralela en Hawkins."],"Peaky Blinders":[2013,6,"Crimen · Drama","La familia Shelby construye un imperio criminal en Birmingham después de la Primera Guerra Mundial."],"La casa de las flores":[2018,3,"Comedia · Drama","Una familia aparentemente perfecta intenta mantener sus secretos mientras gestiona una floristería."],"The White Lotus":[2021,3,"Comedia · Drama","Los huéspedes y empleados de un resort de lujo revelan sus tensiones y secretos."],"Black Mirror":[2011,7,"Ciencia ficción · Antología","Historias independientes que exploran el lado oscuro de la tecnología y la sociedad."],"Severance":[2022,2,"Ciencia ficción · Thriller","Empleados separan quirúrgicamente sus recuerdos laborales de su vida personal."],"The Good Doctor":[2017,7,"Drama · Médico","Un joven cirujano con autismo y habilidades extraordinarias comienza su carrera en un hospital."]};
const TRAILERS={"The Last of Us":"https://www.youtube.com/watch?v=yyGetSp7CIc","Stranger Things":"https://www.youtube.com/watch?v=CUv2mLF2cm0","Peaky Blinders":"https://www.youtube.com/watch?v=oIDq5AUikdo","La casa de las flores":"https://www.youtube.com/watch?v=-HMAMDxyNgw"};
const filters=document.getElementById('filters');let active='Todas';filters.innerHTML='<button class="active" data-x="Todas">Todas</button>'+Object.keys(G).map(x=>'<button data-x="'+x+'">'+x+'</button>').join('');filters.onclick=e=>{if(e.target.tagName==='BUTTON'){active=e.target.dataset.x;document.querySelectorAll('#filters button').forEach(b=>b.classList.toggle('active',b.dataset.x===active));render()}};document.getElementById('q').oninput=render;
function info(t){return DATA[t]||[null,null,'Serie','Información detallada de esta serie todavía no está cargada en tu catálogo.']}
function card(t){const d=info(t),tr=TRAILERS[t];return '<article class="card"><div class="poster">'+(d[0]?'<div class="fallback">'+t+'</div>':'<div class="fallback">'+t+'</div>')+'</div><div class="name">'+t+'</div><div class="meta">'+(d[0]?d[0]+' · '+d[1]+' '+(d[1]===1?'temporada':'temporadas'):'Datos por completar')+'</div><div class="actions">'+(tr?'<a href="'+tr+'" target="_blank" rel="noopener">▶ Tráiler</a>':'<a class="disabled">▶ Tráiler</a>')+'<button onclick="openInfo('+JSON.stringify(t)+')">Info</button></div></article>'}
function render(){const q=document.getElementById('q').value.toLowerCase().trim(),cats=active==='Todas'?Object.keys(G):[active];let html=active==='Todas'&&!q?'<div class="hero"><b>Tu próximo capítulo empieza aquí.</b><div class="muted">'+Object.values(G).flat().length+' series en tu catálogo.</div></div>':'';cats.forEach(c=>{const xs=G[c].filter(t=>t.toLowerCase().includes(q));if(xs.length)html+='<section class="section"><h2>'+c+'</h2><div class="muted">'+xs.length+' series</div><div class="grid">'+xs.map(card).join('')+'</div></section>'});document.getElementById('app').innerHTML=html||'<div class="muted">No encontré esa serie.</div>'}
function openInfo(t){const d=info(t),body=document.getElementById('modalBody');document.getElementById('modal').classList.add('open');body.innerHTML='<h3>'+t+'</h3><div class="facts"><span class="fact">'+(d[0]||'Año pendiente')+'</span><span class="fact">'+(d[1]?d[1]+' '+(d[1]===1?'temporada':'temporadas'):'Temporadas pendientes')+'</span><span class="fact">'+d[2]+'</span></div><p>'+d[3]+'</p>'+(TRAILERS[t]?'<p><a href="'+TRAILERS[t]+'" target="_blank" rel="noopener">▶ Ver tráiler oficial</a></p>':'')}
document.getElementById('close').onclick=()=>document.getElementById('modal').classList.remove('open');document.getElementById('modal').onclick=e=>{if(e.target.id==='modal')document.getElementById('modal').classList.remove('open')};render();</script></body></html>
