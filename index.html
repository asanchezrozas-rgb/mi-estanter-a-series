const EXTRA_SYNOPSIS={"Espartaco":"Arrancado de su hogar y vendido como esclavo, Espartaco transforma el dolor en una rebelión que desafía a la República romana y a quienes creen tener el poder absoluto.","All Her Fault":"Cuando Marissa llega a recoger a su hijo Milo de casa de un compañero, descubre que la dirección era correcta, pero que nadie allí sabe quién es el niño. A partir de esa pesadilla, la investigación desentierra secretos, culpas y tensiones que convierten el caso en un thriller imposible de soltar.","La Oficina":"La sede regional de Jabones Olimpo en Aguascalientes sobrevive al peculiar liderazgo de Jerónimo Ponce III, un jefe heredero con mucha seguridad y poca experiencia. Entre reuniones absurdas, rivalidades y miradas a cámara, la serie adapta el humor incómodo de The Office a un entorno mexicano con identidad propia.","Lo que la verdad esconde: El caso Asunta (Operación Nenúfar)":"Documental de true crime que investiga el asesinato de Asunta Basterra Porto en 2013, con material inédito y declaraciones de sus padres, Rosario Porto y Alfonso Basterra, condenados por el crimen. El cuarto y último episodio repasa además las deliberaciones del jurado que los declaró culpables."};
function synopsis(t,d){if(EXTRA_SYNOPSIS[t])return EXTRA_SYNOPSIS[t];const g=d[2].toLowerCase();if(g.includes('crimen')||g.includes('thriller')||g.includes('misterio'))return d[3]+' Entre secretos, consecuencias y decisiones límite, la tensión crece capítulo a capítulo.';if(g.includes('comedia'))return d[3]+' Con personajes imperfectos y mucho ritmo, encuentra humor incluso en las situaciones más complicadas.';if(g.includes('romance'))return d[3]+' La historia avanza entre vínculos intensos, decisiones difíciles y momentos que cambian a sus protagonistas.';if(g.includes('fantasía')||g.includes('ciencia ficción'))return d[3]+' Su mundo amplía las reglas de la realidad para explorar grandes dilemas humanos.';return d[3]+' Los conflictos personales y las decisiones de sus protagonistas dan a cada episodio un nuevo peso.'}
const POSTER_ALIASES={"Cien años de soledad":"One Hundred Years of Solitude","La Casa de Papel":"Money Heist","Las chicas del cable":"Cable Girls","Espartaco":"Spartacus","El caso Asunta":"The Asunta Case","El desorden que dejas":"The Mess You Leave Behind","Entrevías":"Wrong Side of the Tracks","El tiempo que te doy":"The Time It Takes","Vivir sin permiso":"Unauthorized Living","Anatomía de un escándalo":"Anatomy of a Scandal","Merlí: Sapere Aude":"Merli Sapere Aude","Pablo Escobar: El patrón del mal":"Pablo Escobar: The Boss","La casa de las flores":"The House of Flowers","Aquí no hay quien viva":"Aqui no hay quien viva","Élite":"Elite","Borgen: Power & Glory":"Borgen","And Just Like That…":"And Just Like That","All Her Fault":"All Her Fault","La Oficina":"La Oficina","Karol G: Mañana Fue Bonito":"Karol G: Tomorrow Was Beautiful","Selena: la serie":"Selena: The Series","Luis Miguel: la serie":"Luis Miguel: The Series"};const POSTER_OVERRIDES={"El tiempo que te doy":"https://i.blogs.es/f87e03/el-tiempo-que-te-doy-cartel/1366_2000.jpeg","La Oficina":"https://images.justwatch.com/poster/342156988/s718/la-oficina.jpg","Karol G: Mañana Fue Bonito":"https://images.justwatch.com/poster/330238091/s718/karol-g-tomorrow-was-beautiful.jpg","Borgen: Power & Glory":"https://images.justwatch.com/poster/308760567/s718/borgen-power-and-glory.jpg","Luis Miguel: la serie":"https://images.justwatch.com/poster/141643448/s718/luis-miguel-the-series.jpg","Hasta que te conocí":"https://images.justwatch.com/poster/135246068/s718/hasta-que-te-conoci.jpg"};const POSTER_CACHE={};function showPoster(el,title,url){el.innerHTML='<img src="'+url+'" alt="Portada de '+title+'" loading="lazy" draggable="false">'}async function poster(title,el){if(!el)return;if(POSTER_OVERRIDES[title])return showPoster(el,title,POSTER_OVERRIDES[title]);if(POSTER_CACHE[title])return showPoster(el,title,POSTER_CACHE[title]);try{const response=await fetch('https://api.tvmaze.com/singlesearch/shows?q='+encodeURIComponent(POSTER_ALIASES[title]||title));if(!response.ok)return;const show=await response.json(),url=show.image&&(show.image.original||show.image.medium);if(url){POSTER_CACHE[title]=url;showPoster(el,title,url)}}catch(error){}}
const STORE_KEY='mi-estanteria-datos-v1';function loadStore(){try{const raw=localStorage.getItem(STORE_KEY);const d=raw?JSON.parse(raw):{};return {ratings:d.ratings||{},progress:d.progress||{},catOverride:d.catOverride||{},favorites:d.favorites||{}}}catch(e){return {ratings:{},progress:{},catOverride:{},favorites:{}}}}function saveStore(){try{localStorage.setItem(STORE_KEY,JSON.stringify(STATE))}catch(e){}}const STATE=loadStore();
const RATINGS=STATE.ratings;const FAVORITES=STATE.favorites;const TRAILERS={};function favoriteBadge(t){return FAVORITES[t]?'<span class="favorite-badge">❤</span>':''}function favCheck(t){const on=!!FAVORITES[t];return '<label class="fav-check"><input type="checkbox" class="fav-toggle" data-title="'+encodeURIComponent(t)+'"'+(on?' checked':'')+'> ❤ Marcar como favorita</label>'}
const DONE_CATEGORY='✅ Terminadas';const WATCHING_CATEGORY='🎬 Viendo ahora';const ALL_TITLES=Object.values(G).flat();function effectiveCategory(t){return STATE.catOverride[t]||Object.keys(G).find(c=>G[c].includes(t))}function moveToCategory(t,newCat){const natural=Object.keys(G).find(c=>G[c].includes(t));if(newCat===natural){delete STATE.catOverride[t]}else{STATE.catOverride[t]=newCat}if(newCat===DONE_CATEGORY){delete STATE.progress[t]}}function catSelect(t){const cur=effectiveCategory(t);return '<select class="cat-select" data-title="'+encodeURIComponent(t)+'" aria-label="Cambiar categoría de '+t+'">'+Object.keys(G).map(c=>'<option value="'+c+'"'+(c===cur?' selected':'')+'>'+c+'</option>').join('')+'</select>'}
function progressBadge(t){if(effectiveCategory(t)===DONE_CATEGORY)return '';const p=STATE.progress[t];if(!p||(!p.s&&!p.e))return '';return '<span class="progress-badge">T'+(p.s||'?')+' · E'+(p.e||'?')+'</span>'}
function ratingPicker(t){const r=RATINGS[t]||0;let html='<div class="rate-row">';for(let i=1;i<=5;i++){html+='<button type="button" class="star-btn'+(i<=r?' active':'')+'" data-title="'+encodeURIComponent(t)+'" data-val="'+i+'" aria-label="'+i+' de 5 estrellas">★</button>'}html+='<span class="muted rate-hint">'+(r?r+'/5 · toca para cambiar':'sin valorar')+'</span></div>';return html}
function progressEditor(t){const p=STATE.progress[t]||{};return '<div class="prog-row"><label>Temporada<input type="number" min="1" class="prog-input" data-title="'+encodeURIComponent(t)+'" data-field="s" value="'+(p.s||'')+'"></label><label>Episodio<input type="number" min="1" class="prog-input" data-title="'+encodeURIComponent(t)+'" data-field="e" value="'+(p.e||'')+'"></label></div>'}
function trackingSection(t){if(effectiveCategory(t)===DONE_CATEGORY){const undo=STATE.catOverride[t]?' <button type="button" class="undo-btn" data-title="'+encodeURIComponent(t)+'">deshacer</button>':'';return '<section class="info-section"><h4>Tu progreso</h4><div class="done-row"><span class="fact">✅ Terminada</span>'+undo+'</div></section>'}return '<section class="info-section"><h4>Tu progreso</h4>'+progressEditor(t)+'<label class="done-check"><input type="checkbox" class="complete-check" data-title="'+encodeURIComponent(t)+'"> Marcar como completada (pasa a Terminadas)</label></section>'}
const filters=document.getElementById('filters');let active='Todas';filters.innerHTML='<button class="active" data-x="Todas">Todas</button><button data-x="Favoritas">❤ Favoritas</button>'+Object.keys(G).map(x=>'<button data-x="'+x+'">'+x+'</button>').join('');filters.onclick=e=>{if(e.target.tagName==='BUTTON'){active=e.target.dataset.x;document.querySelectorAll('#filters button').forEach(b=>b.classList.toggle('active',b.dataset.x===active));render()}};document.getElementById('q').oninput=render;
let activeGenre='Todos';const genreFilter=document.getElementById('genreFilter');function buildGenreOptions(){const counts={};Object.keys(DATA).forEach(t=>{const g=primaryGenre(t);counts[g]=(counts[g]||0)+1});if(!('Documental' in counts))counts.Documental=0;const genres=Object.keys(counts).sort((a,b)=>a.localeCompare(b,'es'));genreFilter.innerHTML='<option value="Todos">Todos los géneros</option>'+genres.map(g=>'<option value="'+g+'">'+g+' ('+counts[g]+')</option>').join('')}buildGenreOptions();genreFilter.onchange=()=>{activeGenre=genreFilter.value;render()};
function info(t){return DATA[t]||['—','—','Serie','Una serie de tu estantería personal. La ficha ampliada estará disponible próximamente.']}
function primaryGenre(t){const g=(info(t)[2]||'').split(' · ')[0];return g||'Sin género'}
function stars(t){const rating=RATINGS[t];return rating?'<span class="rating" aria-label="'+rating+' de 5 estrellas">'+('★'.repeat(rating))+('☆'.repeat(5-rating))+'</span>':''}
function details(t){return DETAILS[t]||['Ficha ampliada pendiente','Reparto principal pendiente','Consulta la disponibilidad actual en España']}
function trailerUrl(t){return 'https://www.youtube.com/results?search_query='+encodeURIComponent(t+' tráiler oficial español subtitulado')}
function card(t){const d=info(t);return '<article class="card" draggable="true" data-title="'+encodeURIComponent(t)+'"><div class="poster" data-poster="'+encodeURIComponent(t)+'"><div class="poster-img"><div class="fallback">'+t+'</div></div><span class="genre-badge">'+primaryGenre(t)+'</span>'+progressBadge(t)+stars(t)+favoriteBadge(t)+'</div><div class="name">'+t+'</div><div class="meta">'+(d[0]!=='—'?d[0]+' · '+d[1]+' '+(d[1]===1?'temporada':'temporadas'):'Datos por completar')+'</div><div class="actions"><a href="'+trailerUrl(t)+'" target="_blank" rel="noopener noreferrer">▶ Tráiler</a><button type="button" class="info-button" data-title="'+encodeURIComponent(t)+'">Info</button></div><div class="move-row">'+catSelect(t)+'</div></article>'}
function render(){const q=document.getElementById('q').value.toLowerCase().trim();let html=active==='Todas'&&!q&&activeGenre==='Todos'?'<div class="hero"><b>Tu próximo capítulo empieza aquí.</b><div class="muted">'+Object.values(G).flat().length+' series en tu catálogo.</div></div>':'';let shown=0;if(active==='Favoritas'){const xs=ALL_TITLES.filter(t=>FAVORITES[t]&&t.toLowerCase().includes(q)&&(activeGenre==='Todos'||primaryGenre(t)===activeGenre)).sort((a,b)=>info(b)[0]-info(a)[0]||a.localeCompare(b,'es'));shown=xs.length;if(xs.length)html+='<section class="section" data-category="Favoritas"><h2>❤ Favoritas</h2><div class="muted">'+xs.length+' series</div><div class="grid">'+xs.map(card).join('')+'</div></section>'}else{const cats=active==='Todas'?Object.keys(G):[active];cats.forEach(c=>{const xs=ALL_TITLES.filter(t=>effectiveCategory(t)===c&&t.toLowerCase().includes(q)&&(activeGenre==='Todos'||primaryGenre(t)===activeGenre)).sort((a,b)=>info(b)[0]-info(a)[0]||a.localeCompare(b,'es'));shown+=xs.length;if(xs.length)html+='<section class="section" data-category="'+c+'"><h2>'+c+'</h2><div class="muted">'+xs.length+' series</div><div class="grid">'+xs.map(card).join('')+'</div></section>'})}document.getElementById('app').innerHTML=shown?html:'<div class="muted">No encontré ninguna serie con ese filtro.</div>';document.querySelectorAll('.poster[data-poster]').forEach(el=>poster(decodeURIComponent(el.dataset.poster),el.querySelector('.poster-img')))}
function openInfo(t){const d=info(t),x=details(t),body=document.getElementById('modalBody');document.getElementById('modal').classList.add('open');body.innerHTML='<h3>'+t+'</h3><div class="facts"><span class="fact">'+d[0]+'</span><span class="fact">'+(d[1]!=='—'?d[1]+' '+(d[1]===1?'temporada':'temporadas'):'Temporadas: pendiente')+'</span><span class="fact">'+d[2]+'</span></div><section class="info-section"><h4>Tu valoración</h4>'+ratingPicker(t)+favCheck(t)+'</section>'+trackingSection(t)+'<section class="info-section"><h4>Sinopsis</h4><p>'+synopsis(t,d)+'</p></section><section class="info-section"><h4>Creador/a</h4><p>'+x[0]+'</p></section><section class="info-section"><h4>Reparto principal</h4><p>'+x[1]+'</p></section><section class="info-section"><h4>Disponible en España</h4><p>'+x[2]+'</p></section><p class="muted">La disponibilidad puede cambiar según la plataforma.</p>'}
document.getElementById('app').onclick=e=>{const button=e.target.closest('.info-button');if(button)openInfo(decodeURIComponent(button.dataset.title))};document.getElementById('close').onclick=()=>document.getElementById('modal').classList.remove('open');document.getElementById('modal').onclick=e=>{if(e.target.id==='modal')document.getElementById('modal').classList.remove('open')};
document.getElementById('modalBody').onclick=e=>{const b=e.target.closest('.star-btn');if(b){const t=decodeURIComponent(b.dataset.title),v=+b.dataset.val;RATINGS[t]=(RATINGS[t]===v?0:v);if(!RATINGS[t])delete RATINGS[t];saveStore();openInfo(t);render();return}const u=e.target.closest('.undo-btn');if(u){const t=decodeURIComponent(u.dataset.title);delete STATE.catOverride[t];saveStore();openInfo(t);render()}};
document.getElementById('modalBody').oninput=e=>{const inp=e.target.closest('.prog-input');if(!inp)return;const t=decodeURIComponent(inp.dataset.title),f=inp.dataset.field;STATE.progress[t]=STATE.progress[t]||{};STATE.progress[t][f]=inp.value?+inp.value:null;if(!STATE.progress[t].s&&!STATE.progress[t].e){delete STATE.progress[t]}else if(effectiveCategory(t)!==WATCHING_CATEGORY){moveToCategory(t,WATCHING_CATEGORY)}saveStore();render()};
document.getElementById('modalBody').onchange=e=>{const c=e.target.closest('.complete-check');if(c&&c.checked){const t=decodeURIComponent(c.dataset.title);moveToCategory(t,DONE_CATEGORY);saveStore();openInfo(t);render();return}const f=e.target.closest('.fav-toggle');if(f){const t=decodeURIComponent(f.dataset.title);if(f.checked){STATE.favorites[t]=true}else{delete STATE.favorites[t]}saveStore();openInfo(t);render()}};
document.getElementById('app').onchange=e=>{const sel=e.target.closest('.cat-select');if(!sel)return;const t=decodeURIComponent(sel.dataset.title);moveToCategory(t,sel.value);saveStore();render()};
document.getElementById('app').addEventListener('dragstart',e=>{const c=e.target.closest('.card');if(!c){return}e.dataTransfer.setData('text/plain',c.dataset.title);e.dataTransfer.effectAllowed='move';c.classList.add('dragging')});
document.getElementById('app').addEventListener('dragend',e=>{const c=e.target.closest('.card');if(c)c.classList.remove('dragging');document.querySelectorAll('.section.drag-over').forEach(s=>s.classList.remove('drag-over'))});
document.getElementById('app').addEventListener('dragover',e=>{const sec=e.target.closest('.section');document.querySelectorAll('.section.drag-over').forEach(s=>{if(s!==sec)s.classList.remove('drag-over')});if(!sec)return;e.preventDefault();e.dataTransfer.dropEffect='move';sec.classList.add('drag-over')});
document.getElementById('app').addEventListener('drop',e=>{const sec=e.target.closest('.section');document.querySelectorAll('.section.drag-over').forEach(s=>s.classList.remove('drag-over'));if(!sec)return;e.preventDefault();const raw=e.dataTransfer.getData('text/plain');if(!raw)return;moveToCategory(decodeURIComponent(raw),sec.dataset.category);saveStore();render()});
